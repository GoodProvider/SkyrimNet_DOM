name: DOMSlave_InspectFront
description: Get ready to be inspected when {{ player.name }} asks it. {{ player.name }} will immobilize you and inspect
  your genitalia but you will have to remain still and silent despite the stimulation.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoGrab
parameterMapping:
  - type: speaker
    name: akTarget
    description: The slave being inspected
  - type: static
    value: Front
    name: type
    description: The inspection type - "Front" for front inspection
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} gets ready for inspection"
