customCategory: SkyDOM_FightForMe
name: DOMSlave_FightForMe
description: Be ready to fight for {{ player.name }} when they are attacked. This makes you a combat companion who will 
  defend {{ player.name }} in battle.
questEditorId: SkyrimNet_DOM
scriptName: SkyrimNet_DOM_Actions
executionFunctionName: DOMOrder_Execute
parameterMapping:
  - type: speaker
    name: akTarget
    description: The slave being ordered
  - type: static
    name: kind
    value: fight
  - type: static
    name: actionDesc
    value: fight for me
  - type: static
    name: op
    value: action
  - type: static
    name: arg
    value: FightForMe
  - type: static
    name: arg2
    value: ""

enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
    logicalOperator: AND
    required: true

