name: DOMSlave_ActRespectful
description: Start being respectful to {{ player.name }}.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoActionActor
parameterMapping:
  - type: speaker
    name: akTarget
    description: The person that will be commanded to be respectful
  - type: static
    value: BeRespectful
    name: the_event
    description: The action name for respectful command
  - type: static
    value: ''
    name: type
    description: Action type parameter (empty for respectful)
  - type: static
    value: false
    name: the_flag
    description: Boolean flag parameter (false for respectful)
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true
