name: DOMSlave_ActRespectful
description: Start being respectful to {{ player.name }}.
questEditorId: SkyrimNet_DOM
scriptName: SkyrimNet_DOM_Actions
executionFunctionName: DOMOrder_Execute
parameterMapping:
  - type: speaker
    name: akTarget
    description: The slave being ordered
  - type: static
    name: kind
    value: respectful
  - type: static
    name: actionDesc
    value: be respectful
  - type: static
    name: op
    value: action
  - type: static
    name: arg
    value: BeRespectful
  - type: static
    name: arg2
    value: ""

enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true
