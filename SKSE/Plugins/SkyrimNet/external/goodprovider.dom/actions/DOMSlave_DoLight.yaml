name: DOMSlave_DoLight
description: Start holding a torch or light.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoEntertain
parameterMapping:
  - type: speaker
    name: akTarget
    description: The person that will hold the light
  - type: static
    value: light
    name: type
    description: The entertain type - "light" for light/torch pose
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} holds up a light"
