customCategory: SkyDOM_FightForMe
name: DOMSlave_DontFightForMe
description: Never fight in any circumstance. Do not engage in combat, do not attack anyone, do not defend yourself or 
  {{ player.name }}. Remain completely pacifist.
questEditorId: SkyrimNet_DOM
scriptName: SkyrimNet_DOM_Actions
executionFunctionName: DOMOrder_Execute
parameterMapping:
  - type: speaker
    name: akTarget
    description: The slave being ordered
  - type: static
    name: kind
    value: fight
  - type: static
    name: actionDesc
    value: not fight
  - type: static
    name: op
    value: action
  - type: static
    name: arg
    value: DontFightForMe
  - type: static
    name: arg2
    value: ""

enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
    logicalOperator: AND
    required: true

