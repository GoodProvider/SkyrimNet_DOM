customCategory: SkyDOM_Pose
name: DOMSlave_Display
description: Stand straight, hands behind back, displaying your body. Maintain perfect posture.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoDisplay
parameterMapping:
  - type: speaker
    name: akTarget
    description: The person that will perform the display pose
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} displays their body"
