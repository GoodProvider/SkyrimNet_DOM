customCategory: domslave_sexual_activities
name: DOM_sexual_Refused
description: "[Target] [style] refuses to [direction] [method] for [intent]"
questEditorId: SkyrimNet_SexLab
scriptName: SkyrimNet_SexLab_Actions
executionFunctionName: StartScene_Refused_Two
defaultPriority: 6
parameterMapping:
  - type: dynamic 
    name: intent 
    description: one or two words 
  - type: speaker
    name: speaker
    description: Speaker Actor parameter (triggering entity)
  - type: dynamic
    name: target
    description: rejecting actor
  - type: dynamic
    name: style
    description: forceful|normal|gentle
  - type: dynamic
    name: method
    description: one or two words
  - type: dynamic
    name: direction
    description: "giving|getting"
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: -1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true
