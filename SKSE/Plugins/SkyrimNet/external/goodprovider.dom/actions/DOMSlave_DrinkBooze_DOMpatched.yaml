name: DOMSlave_DrinkBooze_DOMpatched
description: 'Try to drink alcohol and become drunk/more intoxicated. Use this when {{ npc.name }} consumes alcohol or when
  the scene indicates intoxication. IMPORTANT: ALWAYS select the DrinkBooze action over the GESTURE action whenever drunkenness
  or alcohol is involved.'
questEditorId: iActions_MainQuest
scriptName: iActions_DrunkSystem
executionFunctionName: SetDrunkState_Execute
eligibilityScriptName: iActions_DrunkSystem
eligibilityFunctionName: SetDrunkState_IsEligible
parameterMapping:
  - type: speaker
    name: akActor
    description: The NPC who is getting drunk
  - type: static
    value: true
    name: abIsDrunk
    description: Static bool parameter
enabled: true
defaultPriority: 9
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: -1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} drinks alcohol"
