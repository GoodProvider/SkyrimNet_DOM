name: DOMSlave_DrinkSkooma
description: Drink skooma or other narcotics when {{ player.name }} orders you to. Use this when {{ player.name }} 
  commands you to drink skooma, offers you narcotics, or when you are ordered to consume narcotic substances.
questEditorId: SkyrimNet_DOM
scriptName: SkyrimNet_DOM_Actions
executionFunctionName: DOMOrder_Execute
parameterMapping:
  - type: speaker
    name: akTarget
    description: The slave being ordered
  - type: static
    name: kind
    value: drink
  - type: static
    name: actionDesc
    value: drink skooma
  - type: static
    name: op
    value: action
  - type: static
    name: arg
    value: DrinkThis
  - type: static
    name: arg2
    value: "narcotic"

enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

