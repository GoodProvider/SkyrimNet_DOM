name: DOMSlave_DrinkSkooma
description: Drink skooma or other narcotics when {{ player.name }} orders you to. Use this when {{ player.name }} 
  commands you to drink skooma, offers you narcotics, or when you are ordered to consume narcotic substances.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoActionActor
parameterMapping:
  - type: speaker
    name: akTarget
    description: The NPC who will drink skooma
  - type: static
    value: DrinkThis
    name: the_event
    description: The action name for drink command
  - type: static
    value: narcotic
    name: type
    description: The drink type - "narcotic" for skooma and narcotic substances
  - type: static
    value: false
    name: the_flag
    description: Boolean flag parameter (false for drink)
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} drinks skooma"
