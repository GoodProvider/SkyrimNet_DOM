name: DOMSlave_DoMusic
description: Start playing music.
questEditorId: SkyrimNet_DOM
scriptName: SkyrimNet_DOM_Actions
executionFunctionName: DOMOrder_Execute
parameterMapping:
  - type: speaker
    name: akTarget
    description: The slave being ordered
  - type: static
    name: kind
    value: music
  - type: static
    name: actionDesc
    value: play music
  - type: static
    name: op
    value: entertain
  - type: static
    name: arg
    value: music
  - type: static
    name: arg2
    value: ""

enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

