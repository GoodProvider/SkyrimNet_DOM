name: DOMSlave_DrinkAlcohol
description: Drink alcohol when {{ player.name }} orders you to. Use this when {{ player.name }} commands you to drink 
  alcohol, offers you a drink, or when you are ordered to consume alcoholic beverages.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoActionActor
parameterMapping:
  - type: speaker
    name: akTarget
    description: The NPC who will drink alcohol
  - type: static
    value: DrinkThis
    name: the_event
    description: The action name for drink command
  - type: static
    value: alcohol
    name: type
    description: The drink type - "alcohol" for alcoholic beverages
  - type: static
    value: false
    name: the_flag
    description: Boolean flag parameter (false for drink)
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} drinks alcohol"
