customCategory: SkyDOM_Be
name: DOMSlave_BeScolded
description: Use when {{ npc.name }} is being verbally scolded.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoScold
parameterMapping:
  - type: speaker
    name: akTarget
    description: The person that is being scolded
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionBathing
        comparisonOperator: <
        expectedValue: 0
    logicalOperator: AND
    required: true
