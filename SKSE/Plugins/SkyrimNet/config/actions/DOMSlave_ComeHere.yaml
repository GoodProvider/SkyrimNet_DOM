name: DOMSlave_ComeHere
description: Come to {{ player.name }} when asked by {{ player.name }}.
questEditorId: DOM02Topic
scriptName: DOM_Keys
executionFunctionName: DOMDoActionActor
parameterMapping:
  - type: speaker
    name: akTarget
    description: The person that will come to the player
  - type: static
    value: ComeHere
    name: the_event
    description: The action name - "ComeHere"
  - type: static
    value: ''
    name: type
    description: Empty string (not used for this action)
  - type: static
    value: false
    name: the_flag
    description: Boolean flag parameter (false for this action)
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMPlayerSlaveFaction
        comparisonOperator: ==
        expectedValue: 1
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - DOMActionTied
        comparisonOperator: <
        expectedValue: 0
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true

eventString: "{{ actor.name }} gets closer to {{ player.name }}"
