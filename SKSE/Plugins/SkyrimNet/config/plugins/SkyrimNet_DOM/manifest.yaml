plugin:
  name: "SkyrimNet_DOM"
  version: "0.1.0"
  description: "Diary of Mine-SkyrimNet integration"
  icon: "⛓️"

schema:
  fields:
    - name: "Enable Ext2 events"
      path: "dom.events.ext2"
      type: "bool"
      description: "Forwards DOM Ext2 ModEvents (praise, punish, inspect, comfort, and similar) to SkyrimNet. Off by default to avoid LLM spam."
      defaultValue: false
      category: "Events"

    - name: "Notification ring size"
      path: "dom.events.notification_ring"
      type: "int"
      description: "Per-actor aged-notification ring buffer size. New rings use this size; existing rings keep theirs until you load a save."
      min: 5
      max: 50
      defaultValue: 20
      category: "Events"

    - name: "Short-lived event TTL (ms)"
      path: "dom.events.short_lived_ttl"
      type: "int"
      description: "Milliseconds that short-lived SkyrimNet events (obey, runaway, bag, call for help) stay in the short-lived store."
      min: 1000
      max: 600000
      defaultValue: 100000
      category: "Events"

    - name: "When player tortures let player choose"
      path: "dom.punish.torture_choose_reason"
      type: "bool"
      description: "Injury Engine torture of a slave is a DOM punishment. On: when you start torturing a slave, the WebUI lists being a bad slave, didnt obey, the slave's other open punishment reasons, random, custom and no reason. Off: an open reason is chosen at random."
      defaultValue: true
      category: "Punishment"

    - name: "Ask player praise reason when healing"
      path: "dom.praise.heal_choose_reason"
      type: "bool"
      description: "Healing Hands on a slave who is not in shock praises them (a shocked slave gets care comfort instead). On: when you heal, the WebUI lists the slave's praise reasons plus custom; closing the list gives no praise. 'Being a good slave' (or slaver) is always listed first and is the reason used when the setting is off."
      defaultValue: false
      category: "Praise"
